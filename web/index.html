<body>

<script>
  const redirect = sessionStorage.getItem('flutter_redirect');

  if (redirect) {
    sessionStorage.removeItem('flutter_redirect');

    const base = '/teste/';
    const target = redirect.startsWith('/')
        ? redirect
        : '/' + redirect;

    window.history.replaceState(
      null,
      '',
      base.replace(/\/$/, '') + target
    );
  }
</script>

<script src="flutter_bootstrap.js" async></script>

</body>
