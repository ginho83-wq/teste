<body>

<!-- PDF.js -->
<script
        src="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.min.mjs"
        type="module">
</script>

<script type="module">
  var { pdfjsLib } = globalThis;

  if (pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.worker.mjs';

    var pdfRenderOptions = {
      cMapUrl:
        'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/cmaps/',
      cMapPacked: true
    };
  }
</script>

<!-- Recupera a rota guardada pelo 404.html -->
<script>
  var redirect = sessionStorage.getItem('flutter_redirect');

  if (redirect) {
    sessionStorage.removeItem('flutter_redirect');

    history.replaceState(
      null,
      '',
      redirect
    );
  }
</script>

<!-- Inicialização do Flutter -->
<script
        src="flutter_bootstrap.js"
        async>
</script>

</body>
