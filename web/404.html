<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Redirecionar...</title>
    <script>
        // Captura a rota original
        var redirect = window.location.pathname + window.location.search + window.location.hash;
        // Salva em sessionStorage para o index.html recuperar
        sessionStorage.setItem('flutter_redirect', redirect);
        // Redireciona para index.html
        window.location.replace('/teste/');
    </script>
</head>
<body>
<p>A carregar Obra Livre...</p>
</body>
</html>
