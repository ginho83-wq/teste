<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>Obra Livre</title>

    <meta
            name="robots"
            content="noindex, follow"
    >

    <script>
        (function () {
            var pathname = window.location.pathname;
            var search = window.location.search;
            var hash = window.location.hash;

            var rotaOriginal =
                pathname + search + hash;

            try {
                // Guarda a rota solicitada para que o
                // Flutter possa recuperá-la depois.
                sessionStorage.setItem(
                    'flutter_redirect',
                    rotaOriginal
                );
            } catch (erro) {
                console.error(
                    'Não foi possível guardar a rota:',
                    erro
                );
            }

            // Base do projecto no GitHub Pages.
            window.location.replace('/teste/');
        })();
    </script>
</head>

<body>
<p>A carregar a Obra Livre...</p>
</body>
</html>
