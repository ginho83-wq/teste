name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.3'
          channel: stable
          cache: true

      - name: Check Flutter
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Build Flutter Web
        run: flutter build web --release --base-href /teste/

      # ==========================================================
      # PREPARAR ROTAS PÚBLICAS
      # ==========================================================

      - name: Prepare public routes
        run: |
          set -e

          mkdir -p build/web/categorias
          mkdir -p build/web/acervo
          mkdir -p build/web/termos
          mkdir -p build/web/politica-privacidade
          mkdir -p build/web/cookies
          mkdir -p build/web/contacto
          mkdir -p build/web/ajuda
          mkdir -p build/web/obra

          cp build/web/index.html build/web/categorias/index.html
          cp build/web/index.html build/web/acervo/index.html
          cp build/web/index.html build/web/termos/index.html
          cp build/web/index.html build/web/politica-privacidade/index.html
          cp build/web/index.html build/web/cookies/index.html
          cp build/web/index.html build/web/contacto/index.html
          cp build/web/index.html build/web/ajuda/index.html

          echo "Rotas públicas preparadas."

      # ==========================================================
      # PREPARAR ROTAS DAS CATEGORIAS
      # ==========================================================

      - name: Prepare category routes automatically
        run: |
          set -e

          INDEX="build/web/index.html"

          echo "A preparar rotas das categorias..."

          categorias=(
            "Tese Doutoramento"
            "Dissertação de Mestrado"
            "Monografia"
            "Artigos Científicos"
            "Literatura"
          )

          for categoria in "${categorias[@]}"; do

            rota=$(python3 - "$categoria" <<'PY'
          import sys
          import urllib.parse

          categoria = sys.argv[1]

          print(
              urllib.parse.quote(
                  categoria,
                  safe=""
              )
          )
          PY
            )

            destino="build/web/categoria/$rota"

            mkdir -p "$destino"

            cp "$INDEX" "$destino/index.html"

            echo "Rota criada: /categoria/$rota"
          done

          echo "Todas as categorias foram preparadas."

      # ==========================================================
      # PREPARAR ROTAS INDIVIDUAIS DAS OBRAS
      # E GERAR SITEMAP AUTOMATICAMENTE
      # ==========================================================

      - name: Prepare individual obra routes automatically
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

        run: |
          set -e

          echo "A verificar configuração do Supabase..."

          if [ -z "$SUPABASE_URL" ]; then
            echo "ERRO: O Secret SUPABASE_URL não está configurado."
            exit 1
          fi

          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "ERRO: O Secret SUPABASE_ANON_KEY não está configurado."
            exit 1
          fi

          echo "SUPABASE_URL configurado."

          if [[ "$SUPABASE_URL" != http://* && "$SUPABASE_URL" != https://* ]]; then
            echo "ERRO: SUPABASE_URL não contém http:// ou https://"
            exit 1
          fi

          SUPABASE_URL="${SUPABASE_URL%/}"

          echo "A consultar obras publicadas no Supabase..."

          HTTP_STATUS=$(curl -sS \
            -o /tmp/obras.json \
            -w "%{http_code}" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/obras?select=id")

          echo "Resposta HTTP do Supabase: ${HTTP_STATUS}"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "ERRO: Não foi possível consultar a tabela obras."
            echo "Resposta:"
            cat /tmp/obras.json
            exit 1
          fi

          echo "Resposta recebida do Supabase."

          python3 - <<'PY'
          import json
          import os
          import shutil
          from xml.sax.saxutils import escape

          # ======================================================
          # LER OBRAS DO SUPABASE
          # ======================================================

          with open("/tmp/obras.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          if not isinstance(data, list):
              raise RuntimeError(
                  f"Resposta inesperada do Supabase: {data}"
              )

          index = "build/web/index.html"

          print(f"Obras encontradas: {len(data)}")

          # ======================================================
          # CRIAR ROTAS INDIVIDUAIS DAS OBRAS
          # ======================================================

          obra_ids = []

          for obra in data:

              obra_id = str(
                  obra.get("id", "")
              ).strip()

              if not obra_id:
                  continue

              destino = os.path.join(
                  "build",
                  "web",
                  "obra",
                  obra_id,
                  "index.html"
              )

              os.makedirs(
                  os.path.dirname(destino),
                  exist_ok=True
              )

              shutil.copy2(
                  index,
                  destino
              )

              obra_ids.append(obra_id)

              print(
                  f"Rota criada: /obra/{obra_id}/"
              )

          print(
              "Todas as rotas individuais foram preparadas."
          )

          # ======================================================
          # GERAR SITEMAP
          # ======================================================

          base_url = "https://ginho83-wq.github.io/teste"

          sitemap_path = "build/web/sitemap.xml"

          # URLs fixas que já fazem parte do sitemap
          fixed_urls = [
              f"{base_url}/",
              f"{base_url}/acervo/",
              f"{base_url}/categoria/tese-doutoramento/",
              f"{base_url}/categoria/tese-mestrado/",
              f"{base_url}/categoria/monografia/",
              f"{base_url}/categoria/artigos-cientificos/",
              f"{base_url}/categoria/literatura/",
          ]

          with open(
              sitemap_path,
              "w",
              encoding="utf-8"
          ) as sitemap:

              sitemap.write(
                  '<?xml version="1.0" encoding="UTF-8"?>\n'
              )

              sitemap.write(
                  '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n'
              )

              # -----------------------------------------------
              # URLs FIXAS
              # -----------------------------------------------

              for url in fixed_urls:

                  sitemap.write(
                      "    <url>\n"
                  )

                  sitemap.write(
                      f"        <loc>{escape(url)}</loc>\n"
                  )

                  sitemap.write(
                      "    </url>\n"
                  )

              # -----------------------------------------------
              # URLS INDIVIDUAIS DAS OBRAS
              # -----------------------------------------------

              for obra_id in obra_ids:

                  url = (
                      f"{base_url}/obra/{obra_id}/"
                  )

                  sitemap.write(
                      "    <url>\n"
                  )

                  sitemap.write(
                      f"        <loc>{escape(url)}</loc>\n"
                  )

                  sitemap.write(
                      "    </url>\n"
                  )

              sitemap.write(
                  "</urlset>\n"
              )

          print(
              f"Sitemap gerado: {sitemap_path}"
          )

          print(
              f"URLs fixas no sitemap: {len(fixed_urls)}"
          )

          print(
              f"URLs de obras no sitemap: {len(obra_ids)}"
          )

          print(
              f"Total de URLs no sitemap: "
              f"{len(fixed_urls) + len(obra_ids)}"
          )

      # ==========================================================
      # CONFIGURAR GITHUB PAGES
      # ==========================================================

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # ==========================================================
      # UPLOAD
      # ==========================================================

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  # ============================================================
  # DEPLOY
  # ============================================================

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
