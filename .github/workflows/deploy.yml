name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Flutter Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.3"
          channel: stable
          cache: true

      - name: Verificar Flutter
        run: flutter --version

      - name: Instalar dependências
        run: flutter pub get

      - name: Compilar aplicação Flutter Web
        run: |
          flutter build web \
            --release \
            --base-href /teste/

      - name: Preparar rotas estáticas
        shell: bash
        run: |
          set -e

          test -f build/web/index.html
          test -f build/web/404.html

          for rota in \
            acervo \
            categorias \
            termos \
            politica-privacidade \
            cookies \
            contacto \
            ajuda
          do
            mkdir -p "build/web/$rota"

            cp \
              build/web/index.html \
              "build/web/$rota/index.html"
          done

      - name: Preparar rotas de categorias
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re
          import unicodedata
          import shutil

          base = Path("build/web")

          categorias = [
              "Tese de Doutoramento",
              "Dissertação de Mestrado",
              "Monografia",
              "Artigos Científicos",
              "Comunicações Científicas",
              "Posters",
              "Resumos",
              "Relatórios Académicos",
              "Trabalhos Académicos",
          ]

          index_html = base / "index.html"

          if not index_html.exists():
              raise SystemExit(
                  "O ficheiro build/web/index.html não existe."
              )

          for categoria in categorias:
              slug = unicodedata.normalize(
                  "NFKD",
                  categoria
              )

              slug = "".join(
                  c for c in slug
                  if not unicodedata.combining(c)
              )

              slug = re.sub(
                  r"[^a-zA-Z0-9_-]+",
                  "-",
                  slug.lower()
              ).strip("-")

              pasta = base / "categoria" / slug

              pasta.mkdir(
                  parents=True,
                  exist_ok=True
              )

              shutil.copy2(
                  index_html,
                  pasta / "index.html"
              )

              print(
                  f"Rota criada: /categoria/{slug}/"
              )
          PY

      - name: Validar script SEO
        run: |
          python3 -m py_compile \
            scripts/generate_seo_pages.py

      - name: Gerar páginas SEO e sitemap
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python3 scripts/generate_seo_pages.py

      - name: Validar páginas SEO e sitemap
        shell: bash
        run: |
          set -e

          test -s build/web/sitemap.xml
          test -s build/web/robots.txt || true

          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          sitemap = Path("build/web/sitemap.xml")

          raiz = ET.parse(sitemap).getroot()

          namespace = {
              "sm": (
                  "http://www.sitemaps.org/"
                  "schemas/sitemap/0.9"
              )
          }

          urls = raiz.findall("sm:url/sm:loc", namespace)

          if not urls:
              raise SystemExit(
                  "O sitemap não contém URLs."
              )

          print(
              f"Sitemap válido: {len(urls)} URLs."
          )

          pasta_obras = Path("build/web/obra")

          if pasta_obras.exists():
              paginas = list(
                  pasta_obras.glob("*/index.html")
              )
          else:
              paginas = []

          print(
              f"Páginas SEO de obras: {len(paginas)}"
          )
          PY

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Carregar artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Publicar no GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
