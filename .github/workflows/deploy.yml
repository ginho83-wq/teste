name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # 2. Flutter
      # ============================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.3"
          channel: stable
          cache: true

      - name: Verificar Flutter
        run: flutter --version

      # ============================================================
      # 3. Dependências
      # ============================================================
      - name: Flutter Pub Get
        run: flutter pub get

      # ============================================================
      # 4. Build Flutter Web
      # ============================================================
      - name: Build Flutter Web
        run: |
          flutter build web \
            --release \
            --base-href /teste/

      # ============================================================
      # 5. Preparar rotas estáticas principais
      # ============================================================
      - name: Preparar rotas principais
        run: |
          set -e

          mkdir -p build/web/categorias
          mkdir -p build/web/acervo
          mkdir -p build/web/termos
          mkdir -p build/web/politica-privacidade
          mkdir -p build/web/cookies
          mkdir -p build/web/contacto
          mkdir -p build/web/ajuda
          mkdir -p build/web/obra

          cp build/web/index.html build/web/categorias/index.html
          cp build/web/index.html build/web/acervo/index.html
          cp build/web/index.html build/web/termos/index.html
          cp build/web/index.html build/web/politica-privacidade/index.html
          cp build/web/index.html build/web/cookies/index.html
          cp build/web/index.html build/web/contacto/index.html
          cp build/web/index.html build/web/ajuda/index.html

      # ============================================================
      # 6. Preparar rotas das categorias
      # ============================================================
      - name: Preparar rotas das categorias
        run: |
          set -e

          categorias=(
            "Tese Doutoramento"
            "Dissertação Mestrado"
            "Monografia"
            "Artigos Científicos"
            "Comunicações Científicas"
            "Posters"
            "Resumos"
            "Relatórios Académicos"
            "Trabalhos Académicos"
          )

          for categoria in "${categorias[@]}"; do

            rota=$(python3 - "$categoria" <<'PY'
          import sys
          import unicodedata
          import re

          texto = sys.argv[1]

          texto = unicodedata.normalize("NFKD", texto)
          texto = texto.encode("ascii", "ignore").decode("ascii")
          texto = texto.lower()
          texto = re.sub(r"[^a-z0-9]+", "-", texto)
          texto = texto.strip("-")

          print(texto)
          PY
            )

            echo "Criando rota: /categoria/$rota/"

            mkdir -p "build/web/categoria/$rota"
            cp build/web/index.html "build/web/categoria/$rota/index.html"

          done

      # ============================================================
      # 7. Configurar Supabase CLI
      # ============================================================
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # ============================================================
      # 8. Deploy das Supabase Edge Functions
      # ============================================================
      - name: Deploy Supabase Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -e

          echo "Ligando ao projeto Supabase..."
          supabase link --project-ref "$SUPABASE_PROJECT_REF"

          echo "A fazer deploy das Edge Functions..."
          supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"

          echo "Edge Functions publicadas com sucesso."

      # ============================================================
      # 9. Preparar rotas individuais das obras
      # ============================================================
      - name: Preparar rotas individuais das obras
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -e

          echo "A obter obras publicadas do Supabase..."

          RESPONSE=$(curl -sS \
            -w "\n%{http_code}" \
            -X GET \
            "${SUPABASE_URL}/rest/v1/obras?select=id,titulo,descricao,autor,categoria,ano_obra,data_publicacao,numero_paginas,tamanho_arquivo_bytes,url_documento" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Accept: application/json")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Supabase: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Erro ao consultar obras no Supabase:"
            echo "$BODY"
            exit 1
          fi

          echo "$BODY" > /tmp/obras.json

          python3 <<'PY'
          import json
          import html
          import os
          import re
          import unicodedata

          with open("/tmp/obras.json", "r", encoding="utf-8") as f:
              obras = json.load(f)

          base_dir = "build/web/obra"

          def slugify(text):
              if not text:
                  return "obra"

              text = unicodedata.normalize("NFKD", text)
              text = text.encode("ascii", "ignore").decode("ascii")
              text = text.lower()
              text = re.sub(r"[^a-z0-9]+", "-", text)
              text = text.strip("-")

              return text or "obra"

          def escape(value):
              if value is None:
                  return ""
              return html.escape(str(value))

          for obra in obras:
              obra_id = str(obra.get("id", "")).strip()
              titulo = obra.get("titulo") or "Obra Livre"
              descricao = obra.get("descricao") or ""
              autor = obra.get("autor") or ""
              categoria = obra.get("categoria") or ""
              ano = obra.get("ano_obra") or ""

              if not obra_id:
                  continue

              slug = slugify(titulo)

              # O ID continua a identificar a obra de forma única.
              pasta = f"{base_dir}/{obra_id}"

              os.makedirs(pasta, exist_ok=True)

              titulo_html = escape(titulo)
              descricao_html = escape(descricao)
              autor_html = escape(autor)
              categoria_html = escape(categoria)
              ano_html = escape(ano)

              html_content = f"""<!DOCTYPE html>
          <html lang="pt">
          <head>
            <meta charset="UTF-8">

            <title>{titulo_html} — Obra Livre</title>

            <meta
              name="description"
              content="{descricao_html}"
            >

            <meta name="author" content="{autor_html}">

            <meta
              name="viewport"
              content="width=device-width, initial-scale=1.0"
            >

            <meta
              property="og:title"
              content="{titulo_html} — Obra Livre"
            >

            <meta
              property="og:description"
              content="{descricao_html}"
            >

            <meta
              property="og:type"
              content="article"
            >

            <meta
              property="og:image"
              content="https://ginho83-wq.github.io/teste/OL.png"
            >

            <meta
              property="og:url"
              content="https://ginho83-wq.github.io/teste/obra/{obra_id}/"
            >

            <link
              rel="canonical"
              href="https://ginho83-wq.github.io/teste/obra/{obra_id}/"
            >

            <script type="application/ld+json">
          {json.dumps({
              "@context": "https://schema.org",
              "@type": "ScholarlyArticle",
              "name": titulo,
              "author": {
                  "@type": "Person",
                  "name": autor
              },
              "description": descricao,
              "genre": categoria,
              "datePublished": str(ano) if ano else None,
              "url": f"https://ginho83-wq.github.io/teste/obra/{obra_id}/"
          }, ensure_ascii=False, indent=2)}
            </script>
          </head>

          <body>
            <h1>{titulo_html}</h1>

            <p><strong>Autor:</strong> {autor_html}</p>
            <p><strong>Categoria:</strong> {categoria_html}</p>
            <p><strong>Ano:</strong> {ano_html}</p>

            <p>{descricao_html}</p>

            <p>
              <a href="https://ginho83-wq.github.io/teste/">
                Obra Livre
              </a>
            </p>
          </body>
          </html>
          """

              with open(
                  f"{pasta}/index.html",
                  "w",
                  encoding="utf-8"
              ) as f:
                  f.write(html_content)

          print(f"{len(obras)} obras processadas.")
          PY

      # ============================================================
      # 10. Gerar sitemap.xml
      # ============================================================
      - name: Gerar sitemap
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -e

          python3 <<'PY'
          import json
          import re
          import unicodedata
          from datetime import datetime, timezone

          BASE_URL = "https://ginho83-wq.github.io/teste"

          categorias = [
              "Tese Doutoramento",
              "Dissertação Mestrado",
              "Monografia",
              "Artigos Científicos",
              "Comunicações Científicas",
              "Posters",
              "Resumos",
              "Relatórios Académicos",
              "Trabalhos Académicos",
          ]

          def slugify(text):
              text = unicodedata.normalize("NFKD", text)
              text = text.encode("ascii", "ignore").decode("ascii")
              text = text.lower()
              text = re.sub(r"[^a-z0-9]+", "-", text)
              return text.strip("-")

          urls = [
              f"{BASE_URL}/",
              f"{BASE_URL}/acervo/",
              f"{BASE_URL}/categorias/",
              f"{BASE_URL}/termos/",
              f"{BASE_URL}/politica-privacidade/",
              f"{BASE_URL}/cookies/",
              f"{BASE_URL}/contacto/",
              f"{BASE_URL}/ajuda/",
          ]

          # ----------------------------------------------------------
          # Categorias
          # ----------------------------------------------------------

          for categoria in categorias:
              slug = slugify(categoria)
              urls.append(
                  f"{BASE_URL}/categoria/{slug}/"
              )

          # ----------------------------------------------------------
          # Obras
          # ----------------------------------------------------------

          with open("/tmp/obras.json", "r", encoding="utf-8") as f:
              obras = json.load(f)

          for obra in obras:
              obra_id = str(obra.get("id", "")).strip()

              if obra_id:
                  urls.append(
                      f"{BASE_URL}/obra/{obra_id}/"
                  )

          # ----------------------------------------------------------
          # Remover duplicados mantendo a ordem
          # ----------------------------------------------------------

          urls = list(dict.fromkeys(urls))

          hoje = datetime.now(timezone.utc).strftime("%Y-%m-%d")

          linhas = [
              '<?xml version="1.0" encoding="UTF-8"?>',
              '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
          ]

          for url in urls:
              linhas.append("  <url>")
              linhas.append(f"    <loc>{url}</loc>")
              linhas.append(f"    <lastmod>{hoje}</lastmod>")
              linhas.append("  </url>")

          linhas.append("</urlset>")

          with open(
              "build/web/sitemap.xml",
              "w",
              encoding="utf-8"
          ) as f:
              f.write("\n".join(linhas))

          print(f"Sitemap gerado com {len(urls)} URLs.")
          PY

      # ============================================================
      # 11. Configurar GitHub Pages
      # ============================================================
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # ============================================================
      # 12. Upload do site
      # ============================================================
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  # ================================================================
  # 13. Deploy no GitHub Pages
  # ================================================================
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
